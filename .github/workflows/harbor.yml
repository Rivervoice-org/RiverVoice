name: harbor

on:
  push:
    branches: [main]
    paths:
      - "harbor/**"
      - ".github/workflows/harbor.yml"
  pull_request:
    paths:
      - "harbor/**"
      - ".github/workflows/harbor.yml"

permissions:
  contents: read

concurrency:
  group: harbor-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: harbor

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: harbor/go.mod
          # No go.sum yet (no third-party deps), so key the cache off go.mod.
          cache-dependency-path: harbor/go.mod

      - name: Gofmt
        # gofmt -l prints unformatted files; fail if the list is non-empty.
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...
