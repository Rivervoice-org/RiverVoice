name: mobile-android-production-build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: mobile-android-production-build
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile

jobs:
  build:
    runs-on: ubuntu-latest
    environment: mobile-production-build-approval
    # Only this job needs to create the release — everything else in the
    # workflow only reads repo contents.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        run: |
          git fetch origin main --depth=1
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME (commit $GITHUB_SHA) is not on main — refusing to build" >&2
            exit 1
          fi

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Licenses are accepted by default (accept-android-sdk-licenses: yes).
      - uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm ci

      # .env is gitignored and never reaches the runner otherwise — without
      # this, EXPO_PUBLIC_ENVIRONMENT and every EXPO_PUBLIC_*_PROD var are
      # unset when Expo inlines them into the JS bundle below, and the app
      # throws immediately on launch (config.ts's environment() rejects an
      # unset/invalid value).
      - name: Write production .env
        run: |
          cat > .env <<'MOBILE_ENV_EOF'
          ${{ secrets.MOBILE_ENV_PRODUCTION }}
          MOBILE_ENV_EOF

      # APP_VARIANT=production is the config default already, but explicit
      # here since this is the one workflow that ships to the store.
      - name: Prebuild native Android project
        env:
          APP_VARIANT: production
        run: npx expo prebuild --platform android --non-interactive

      # expo prebuild regenerates gradle.properties from Expo's template
      # every run, which doesn't turn on Gradle's build cache — without
      # this, setup-gradle below has nothing to actually cache task
      # outputs into, even though it's caching ~/.gradle regardless.
      - name: Enable Gradle build cache
        run: |
          echo "org.gradle.caching=true" >> android/gradle.properties
          echo "org.gradle.parallel=true" >> android/gradle.properties

      - uses: gradle/actions/setup-gradle@v6

      # Only arm64-v8a instead of the default four ABIs — this is an
      # internal/testing artifact, not a store release, and native
      # compilation (webrtc, audio, worklets) is what actually dominates the
      # build time here.
      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rivervoice-mobile-production-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      # Creates the release if it doesn't exist yet, or just re-uploads the
      # APK if re-running the same tag.
      - name: Attach APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            android/app/build/outputs/apk/release/app-release.apk \
          || gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            android/app/build/outputs/apk/release/app-release.apk
