name: mobile-android-build

on:
  workflow_dispatch: {}
  pull_request: {}
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: mobile-android-build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile

jobs:
  build:
    runs-on: ubuntu-latest
    # Gates every run behind manual approval — including your own PRs, which
    # the built-in "require approval for fork PRs" repo setting does NOT do
    # (that only applies to outside contributors). Requires a one-time setup
    # step: Settings → Environments → New environment → name it
    # "mobile-build-approval" → add required reviewers (yourself). Scoped to
    # just this job/workflow; nothing else in the repo is affected.
    environment: mobile-build-approval
    # Only this job needs to create/update a release — everything else in
    # the workflow only reads repo contents.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Licenses are accepted by default (accept-android-sdk-licenses: yes).
      - uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm ci

      # Generates the android/ project from app.json (expo-router,
      # expo-dev-client, @config-plugins/react-native-webrtc) — this repo
      # is a managed Expo project, so android/ doesn't exist until this runs.
      - name: Prebuild native Android project
        run: npx expo prebuild --platform android --non-interactive

      # expo prebuild regenerates gradle.properties from Expo's template
      # every run, which doesn't turn on Gradle's build cache — without
      # this, setup-gradle below has nothing to actually cache task
      # outputs into, even though it's caching ~/.gradle regardless.
      - name: Enable Gradle build cache
        run: |
          echo "org.gradle.caching=true" >> android/gradle.properties
          echo "org.gradle.parallel=true" >> android/gradle.properties

      - uses: gradle/actions/setup-gradle@v6

      # Only arm64-v8a instead of the default four ABIs — this is a CI/test
      # artifact, not a store release, and native compilation (webrtc,
      # audio, worklets) is what actually dominates the build time here.
      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon -PreactNativeArchitectures=arm64-v8a

      - uses: actions/upload-artifact@v4
        with:
          name: rivervoice-mobile-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      # Only on an actual tag push (workflow_dispatch/pull_request runs have
      # no tag to attach to) — creates the release if it doesn't exist yet,
      # or just re-uploads the APK if re-running the same tag.
      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            android/app/build/outputs/apk/debug/app-debug.apk \
          || gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            android/app/build/outputs/apk/debug/app-debug.apk
