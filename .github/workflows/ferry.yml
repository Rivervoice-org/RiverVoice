name: ferry

on:
  push:
    branches: [main]
    paths:
      - "ferry/**"
      - ".github/workflows/ferry.yml"
  pull_request:
    paths:
      - "ferry/**"
      - ".github/workflows/ferry.yml"

permissions:
  contents: read

concurrency:
  group: ferry-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: ferry

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ferry

      - name: Rustfmt
        run: cargo fmt --check

      # Advisory for now: the tree has ~15 outstanding lints (dead code,
      # module_inception, manual_is_multiple_of). Clear those, then add
      # `-- -D warnings` here to make clippy blocking.
      - name: Clippy
        run: cargo clippy --all-targets

      - name: Test
        run: cargo test --all-targets
