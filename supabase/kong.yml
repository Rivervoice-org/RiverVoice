_format_version: "2.1"

# The apikey Kong checks on rest/storage — SUPABASE_PUBLISHABLE_KEY /
# SUPABASE_SECRET_KEY from .env. Clients send it as `apikey: <key>`, same as
# Supabase Cloud. Kong's declarative config does not do variable substitution,
# so this file is a template: docker-compose.yml expands the two
# $SUPABASE_PUBLISHABLE_KEY / $SUPABASE_SECRET_KEY placeholders from its env
# via sed before Kong reads it — nothing real is committed here. Values are
# self-signed for local stack (see docker-compose.yml), not Cloud credentials.
consumers:
  - username: anon
    keyauth_credentials:
      - key: $SUPABASE_PUBLISHABLE_KEY
  - username: service_role
    keyauth_credentials:
      - key: $SUPABASE_SECRET_KEY

acls:
  - consumer: anon
    group: anon
  - consumer: service_role
    group: admin

services:
  - name: auth-v1
    url: http://auth:9999/
    routes:
      - name: auth-v1-all
        strip_path: true
        paths:
          - /auth/v1/

  - name: rest-v1
    url: http://rest:3000/
    routes:
      - name: rest-v1-all
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: key-auth
        config:
          key_names: ["apikey"]
          hide_credentials: true

  - name: storage-v1
    url: http://storage:5000/
    routes:
      - name: storage-v1-all
        strip_path: true
        paths:
          - /storage/v1/
    plugins:
      - name: key-auth
        config:
          key_names: ["apikey"]
          hide_credentials: true
