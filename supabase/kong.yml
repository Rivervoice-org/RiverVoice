_format_version: "2.1"

# The apikey Kong checks on rest/storage is the ANON_KEY or SERVICE_ROLE_KEY
# from .env — clients send it as `apikey: <key>`, same as Supabase Cloud.
# Kong's declarative config does NOT do ${...} substitution on its own, so
# these are the literal dev keys from .env, copied in by hand. If ANON_KEY
# or SERVICE_ROLE_KEY in .env ever change, update these two lines to match.
consumers:
  - username: anon
    keyauth_credentials:
      - key: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlLWxvY2FsIiwiaWF0IjoxNzg4MTE0ODkyLCJleHAiOjIxMDM0NzQ4OTJ9.jZInlEx5NPIwvEUiSi-4CAOXGPY84abt9_UbajruYPA
  - username: service_role
    keyauth_credentials:
      - key: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIiwiaXNzIjoic3VwYWJhc2UtbG9jYWwiLCJpYXQiOjE3ODgxMTQ4OTIsImV4cCI6MjEwMzQ3NDg5Mn0.dnjGnpMBMCTDjw3_4zWjxi0zrSzgmMD823dYwY3hBYI

acls:
  - consumer: anon
    group: anon
  - consumer: service_role
    group: admin

services:
  - name: auth-v1
    url: http://auth:9999/
    routes:
      - name: auth-v1-all
        strip_path: true
        paths:
          - /auth/v1/

  - name: rest-v1
    url: http://rest:3000/
    routes:
      - name: rest-v1-all
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: key-auth
        config:
          key_names: ["apikey"]
          hide_credentials: true

  - name: storage-v1
    url: http://storage:5000/
    routes:
      - name: storage-v1-all
        strip_path: true
        paths:
          - /storage/v1/
    plugins:
      - name: key-auth
        config:
          key_names: ["apikey"]
          hide_credentials: true
