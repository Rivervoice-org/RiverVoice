[package]
name = "migration"
version = "0.1.0"
edition = "2024"

[lib]
name = "migration"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
dotenvy = "0.15"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dependencies.sea-orm-migration]
version = "2.0.2"
features = ["sqlx-postgres", "runtime-tokio-rustls"]
