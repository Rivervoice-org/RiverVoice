[package]
name = "ferry"
version = "0.2.0-dev.1"
edition = "2024"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
axum = { version = "0.8.9", features = ["ws"] }
dotenvy = "0.15"
futures-util = "0.3"
hound = "3.5"
jsonwebtoken = "9"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "fmt",
    "ansi",
    "std",
    "smallvec",
    "env-filter",
    "json",
] }
nu-ansi-term = "0.50"
rubato = { version = "5.0.0", features = ["fft_resampler"] }
audioadapter-buffers = "5.1.0"
webrtc = "0.20.2"
bytes = "1.12.1"
validator = { version = "0.19", features = ["derive"] }
uuid = { version = "1", features = ["serde", "v4"] }
audiopus = { version = "0.2.0", default-features = false, features = ["encoder", "decoder"] }
audiopus_sys = { version = "0.1", features = ["static"] }
rtc = "0.20.3"
rand = "0.8"
sea-orm = { version = "2.0.2", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-uuid", "with-chrono"] }
# Generates the mobile app's TypeScript types straight from these Rust
# structs (see `cargo test export_bindings`), so the wire contract has one
# definition instead of a hand-maintained copy that silently drifts.
# `serde-compat` is what makes #[serde(rename = ...)] on the enums carry
# through; chrono/uuid impls are what map DateTimeWithTimeZone and Uuid to
# `string` rather than failing to resolve.
ts-rs = { version = "11", features = ["chrono-impl", "uuid-impl"] }

[profile.dev]
debug = 1
