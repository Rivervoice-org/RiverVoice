[package]
name = "ferry"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
axum = { version = "0.8.9", features = ["ws"] }
dotenvy = "0.15"
futures-util = "0.3"
jsonwebtoken = "9"
nnnoiseless = "0.5"
ort = { version = "2.0.0-rc.13", default-features = false, features = ["download-binaries", "tls-rustls"] }
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "fmt",
    "ansi",
    "std",
    "smallvec",
    "env-filter",
    "json",
] }
nu-ansi-term = "0.50"
rubato = { version = "5.0.0", features = ["fft_resampler"] }
audioadapter-buffers = "5.1.0"
webrtc = "0.20.2"
bytes = "1.12.1"
validator = { version = "0.19", features = ["derive"] }
uuid = { version = "1", features = ["serde", "v4"] }
regex = "1"
# `schema.rs` (below) is generated by `diesel print-schema` against
# harbor's real, migrated database — never hand-written. A column type
# change there changes the generated Rust type, and any query assuming
# the old type fails to compile.
diesel = { version = "2.2", default-features = false, features = [
    "postgres_backend",
    "uuid",
    "serde_json",
    "chrono",
    # agent_versions has 36 columns, past the default 16-column limit
    # diesel's table! macro supports without this — it also brings in
    # 32-column-tables, which call_usage's 20 columns need.
    "64-column-tables",
] }
# Diesel's core connection is sync; ferry is async end to end (axum,
# tokio), so queries run through diesel-async's AsyncPgConnection instead
# of spawn_blocking-wrapped sync calls. Its own `deadpool` feature is the
# currently recommended pooling path (over the separate deadpool-diesel
# crate).
diesel-async = { version = "0.5", features = ["postgres", "deadpool"] }
# The one piece Diesel doesn't generate for you: a Postgres enum still
# needs a hand-declared Rust enum whose variants match. This derive wires
# it to Diesel's type system so a variant mismatch is a compile error,
# not a runtime one — see db/enums.rs. Pinned to the 3.0.0-beta line
# because that's the release actually tested against diesel 2.2.x (the
# 2.x releases predate diesel 2.2 support) — worth knowing it's pre-1.0,
# same as flagging Cornucopia's maintenance history mattered earlier.
diesel-derive-enum = { version = "3.0.0-beta.1", features = ["postgres"] }

[profile.dev]
debug = 1
