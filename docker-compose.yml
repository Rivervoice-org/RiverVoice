services:
  db:
    # supabase/postgres, not vanilla postgres — auth/rest/storage all expect
    # the roles (anon, authenticated, service_role, authenticator) and
    # extensions this image provisions on first boot.
    image: supabase/postgres:15.8.1.060
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: 3600
    ports:
      # Loopback only — ferry runs natively on the host (not in this compose
      # network) and needs localhost:5432, but nothing outside this machine
      # should be able to reach Postgres directly.
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth:
    image: supabase/gotrue:v2.170.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # DNS for googleapis.com returns AAAA records, and this container's
    # network can send IPv6 packets out but never gets a reply (blackholed,
    # not rejected) — GoTrue's Go HTTP client hangs on that address until
    # its own ~10s context deadline kills the request (504 request_timeout
    # on the id_token grant), even though the IPv4 path works instantly.
    # Disabling IPv6 here means Go only ever sees the working A records.
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      SUPABASE_URL: ${SUPABASE_URL}
      # GoTrue still reads API_EXTERNAL_URL — derive from SUPABASE_URL
      API_EXTERNAL_URL: ${SUPABASE_URL}
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      # Native Google Sign-In (mobile SDK, ID-token flow) verifies the token
      # directly against Google — no OAuth redirect, so no client secret or
      # redirect URI needed here. Only fill these in if a web-side redirect
      # flow is ever added on top.
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: "true"
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}

  rest:
    image: postgrest/postgrest:v12.2.8
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"

  storage:
    image: supabase/storage-api:v1.19.3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    environment:
      # storage-api still reads ANON_KEY/SERVICE_KEY — map from new keys
      ANON_KEY: ${SUPABASE_PUBLISHABLE_KEY}
      SERVICE_KEY: ${SUPABASE_SECRET_KEY}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY}
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      POSTGREST_URL: http://rest:3000
      FILE_SIZE_LIMIT: "52428800"
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
    volumes:
      - storage_data:/var/lib/storage

  kong:
    # The one public entrypoint — auth/rest/storage above have no published
    # ports, only kong does, so nothing can bypass its routing/API-key check.
    image: kong:2.8.1
    restart: unless-stopped
    depends_on:
      - auth
      - rest
      - storage
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl
    volumes:
      - ./supabase/kong.yml:/home/kong/kong.yml.template:ro
    # kong.yml.template has no real secrets — the $SUPABASE_PUBLISHABLE_KEY /
    # $SUPABASE_SECRET_KEY tokens get substituted from .env into the file Kong
    # actually reads. Plain sed, not envsubst (no gettext) and not eval.
    entrypoint:
      - sh
      - -c
      - "sed -e \"s#\\$$SUPABASE_PUBLISHABLE_KEY#${SUPABASE_PUBLISHABLE_KEY}#g\" -e \"s#\\$$SUPABASE_SECRET_KEY#${SUPABASE_SECRET_KEY}#g\" /home/kong/kong.yml.template > /home/kong/kong.yml && /docker-entrypoint.sh kong docker-start"
    ports:
      - "8000:8000"

volumes:
  db_data:
  storage_data:
