# One-time setup on the Lightsail instance (not touched by CI — this only
# changes if the reverse proxy setup itself changes):
#   sudo apt install -y nginx certbot python3-certbot-nginx
#   sudo cp deploy/nginx/ferry.conf /etc/nginx/sites-available/ferry
#   sudo ln -s /etc/nginx/sites-available/ferry /etc/nginx/sites-enabled/ferry
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx   # plain HTTP works at this point
#   sudo certbot --nginx -d api.rivervoice.in --redirect
#     # certbot adds its own "listen 443 ssl" server block below this one,
#     # copies this location block into it, fills in the real
#     # ssl_certificate/ssl_certificate_key paths, and rewrites this port-80
#     # block into a redirect to https — don't hand-write any of that
#     # yourself first, or `nginx -t` fails before certbot ever runs.
#
# Only ferry's HTTP/WS control-plane traffic goes through here — PUBLIC_BASE_URL
# (Twilio webhooks/status) and the mobile app's EXPO_PUBLIC_FERRY_URL should
# both point at https://api.rivervoice.in after this is live. WebRTC's actual RTP
# media never touches nginx: it's raw UDP straight to WEBRTC_BIND_IP, by
# design (see transport/webrtc/transport.rs) — nginx has nothing to do with it.

# Required for the websocket upgrade headers below: maps the client's
# Upgrade header to what Connection should be, so a plain HTTP request
# (Upgrade absent) doesn't get "Connection: upgrade" sent to ferry too.
map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

server {
    listen 80;
    server_name api.rivervoice.in;

    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;

        # Needed for /v1/twilio/ws/{call_id} (Twilio Media Streams) and any
        # other websocket route — a plain HTTP request doesn't ask to
        # upgrade, so this is harmless for the rest of ferry's routes.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A call's Media Streams websocket and the try-agent demo socket
        # stay open, mostly idle between packets, for the whole call —
        # nginx's 60s default here would silently kill a live call.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
