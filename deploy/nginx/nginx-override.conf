# One-time setup on the Lightsail instance:
#   sudo mkdir -p /etc/systemd/system/nginx.service.d
#   sudo cp deploy/nginx/nginx-override.conf /etc/systemd/system/nginx.service.d/override.conf
#   sudo systemctl daemon-reload
#
# A "drop-in" — layered on top of the nginx package's own service file
# instead of editing it directly, so an `apt upgrade` of nginx can't silently
# discard this. Stock Ubuntu's nginx.service starts on boot but has no
# Restart= — if the process dies mid-session (not a stop/reload, an actual
# crash), it just stays down until someone notices. This makes it behave the
# same way ferry.service already does.
[Service]
Restart=on-failure
RestartSec=2
