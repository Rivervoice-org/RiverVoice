repos:
  - repo: local
    hooks:
      - id: prettier
        name: prettier (web)
        entry: prettier --write --ignore-path web/.prettierignore
        language: node
        additional_dependencies: ["prettier@3.9.6"]
        files: ^web/.*\.(ts|tsx|js|jsx|mjs|css|json|md)$

      # Mobile keeps its own prettier config: it is hand-wrapped at 80
      # columns where web sits at 100, and its generated ts-rs bindings have
      # to stay out of prettier's way (see mobile/.prettierignore).
      - id: prettier-mobile
        name: prettier (mobile)
        entry: prettier --write --config mobile/.prettierrc.json --ignore-path mobile/.prettierignore
        language: node
        additional_dependencies: ["prettier@3.9.6"]
        files: ^mobile/.*\.(ts|tsx|js|jsx|mjs|css|json)$

      - id: rustfmt
        name: rustfmt (ferry)
        entry: rustfmt --edition 2024
        language: system
        files: ^ferry/.*\.rs$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-added-large-files
